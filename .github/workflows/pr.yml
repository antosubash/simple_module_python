name: PR

on:
  pull_request:
    branches: [main]

# Cancel in-progress runs when new commits are pushed to the same PR
# so we never waste minutes on outdated code.
concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-lint:
    name: Python lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
          python-version: "3.12"
      - run: make install-py
      - run: make ci-python-lint

  python-typecheck:
    name: Python typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
          python-version: "3.12"
      - run: make install-py
      - run: make ci-python-typecheck

  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
          python-version: "3.12"
      - run: make install-py
      - run: make test

  js-lint:
    name: JS lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
      - run: make install-js
      - run: make ci-js-lint

  js-typecheck:
    name: JS typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
      - run: make install-js
      - run: make ci-js-typecheck

  # Single required status check for branch protection.
  # Protect `main` with this one check and every leaf job is required transitively.
  pr-checks:
    name: PR checks
    runs-on: ubuntu-latest
    needs:
      - python-lint
      - python-typecheck
      - python-tests
      - js-lint
      - js-typecheck
    if: always()
    steps:
      - name: Fail if any dependency failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "All PR checks passed."
