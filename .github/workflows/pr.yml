name: PR

on:
  pull_request:
    branches: [main]

# Cancel in-progress runs when new commits are pushed to the same PR
# so we never waste minutes on outdated code.
concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-lint:
    name: Python lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
      - name: Set up Python
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --all-packages
      - name: ruff format (check)
        run: uv run ruff format --check .
      - name: ruff lint
        run: uv run ruff check .

  python-typecheck:
    name: Python typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
      - name: Set up Python
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --all-packages
      - name: ty typecheck
        run: uv run ty check

  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
      - name: Set up Python
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --all-packages
      - name: pytest
        run: uv run pytest

  js-lint:
    name: JS lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: biome check (lint + format)
        run: npx biome ci .

  js-typecheck:
    name: JS typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: tsc --noEmit
        run: npx tsc --noEmit -p host/client_app/tsconfig.json

  # Single required status check for branch protection.
  # Protect `main` with this one check and every leaf job is required.
  pr-checks:
    name: PR checks
    runs-on: ubuntu-latest
    needs:
      - python-lint
      - python-typecheck
      - python-tests
      - js-lint
      - js-typecheck
    if: always()
    steps:
      - name: Fail if any dependency failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "All PR checks passed."
