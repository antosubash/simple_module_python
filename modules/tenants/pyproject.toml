[project]
name = "simple_module_tenants"
version = "0.0.35"
description = "Organisations, memberships and tenant resolution for simple_module SaaS installs"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Anto Subash", email = "antosubash@live.com" }]
keywords = ["simple-module", "tenants"]
dependencies = [
    "simple_module_core==0.0.35",
    "simple_module_db==0.0.35",
    "simple_module_hosting==0.0.35",
    "simple_module_inertia==0.0.35",
    "simple_module_settings==0.0.35",
    "simple_module_auth==0.0.35",
    "cachetools>=5.3",
]

[project.entry-points.simple_module]
tenants = "tenants.module:TenantsModule"

[project.urls]
Homepage = "https://github.com/antosubash/simple_module_python"
Repository = "https://github.com/antosubash/simple_module_python"
Issues = "https://github.com/antosubash/simple_module_python/issues"
Changelog = "https://github.com/antosubash/simple_module_python/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The distribution name (simple_module_tenants) doesn't match the package
# directory (tenants), so hatchling can't infer what to ship — without
# this the wheel builds empty and the entry point fails to import.
[tool.hatch.build.targets.wheel]
packages = ["tenants"]

# Ship the module-root package.json inside the wheel so the host can
# discover JS deps via importlib.resources after a pip install.
[tool.hatch.build.targets.wheel.force-include]
"package.json" = "tenants/package.json"

[tool.uv.sources]
simple_module_core = { workspace = true }
simple_module_db = { workspace = true }
simple_module_hosting = { workspace = true }
simple_module_inertia = { workspace = true }
simple_module_settings = { workspace = true }
simple_module_auth = { workspace = true }
