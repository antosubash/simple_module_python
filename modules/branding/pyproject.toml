[project]
name = "simple_module_branding"
version = "0.0.27"
description = "Customisable application branding (name, logo, favicon, primary colour) for simple_module apps"
readme = "README.md"
license = "MIT"
authors = [{ name = "Anto Subash", email = "antosubash@live.com" }]
keywords = ["simple-module", "branding", "theming", "white-label"]
requires-python = ">=3.12"
dependencies = [
    "simple_module_core==0.0.27",
    "simple_module_db==0.0.27",
    "simple_module_hosting==0.0.27",
    "simple_module_settings==0.0.27",
    "simple_module_file_storage==0.0.27",
]

[project.urls]
Repository = "https://github.com/antosubash/simple_module_python"

[project.entry-points.simple_module]
branding = "branding.module:BrandingModule"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["branding"]

# Ship the module-root package.json inside the wheel so the host can
# discover JS deps via importlib.resources after a pip install.
[tool.hatch.build.targets.wheel.force-include]
"package.json" = "branding/package.json"

[tool.uv.sources]
simple_module_core = { workspace = true }
simple_module_db = { workspace = true }
simple_module_hosting = { workspace = true }
simple_module_settings = { workspace = true }
simple_module_file_storage = { workspace = true }
