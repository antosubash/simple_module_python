[project]
name = "auth"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Anto Subash", email = "antosubash@live.com" }
]
requires-python = ">=3.12"
dependencies = [
    "authlib>=1.3",
    "itsdangerous>=2.2",
    "python-jose[cryptography]>=3.3",
    "simple-module-core",
    "simple-module-db",
]

[project.entry-points.simple_module]
auth = "auth.module:AuthModule"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
simple-module-core = { workspace = true }
simple-module-db = { workspace = true }
