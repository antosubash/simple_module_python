[project]
name = "dashboard"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Anto Subash", email = "antosubash@live.com" }
]
requires-python = ">=3.12"
dependencies = [
    "simple-module-core",
    "simple-module-db",
    "simple-module-hosting",
    "products",
]

[project.entry-points.simple_module]
dashboard = "dashboard.module:DashboardModule"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Ship the module-root package.json inside the wheel so the host can
# discover JS deps via importlib.resources after a pip install.
[tool.hatch.build.targets.wheel.force-include]
"package.json" = "dashboard/package.json"

[tool.uv.sources]
simple-module-core = { workspace = true }
simple-module-db = { workspace = true }
simple-module-hosting = { workspace = true }
products = { workspace = true }
