[project]
name = "sm-dashboard"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Anto Subash", email = "antosubash@live.com" }
]
requires-python = ">=3.12"
dependencies = [
    "simple-module-core",
    "simple-module-db",
    "simple-module-hosting",
    "sm-products",
]

[project.entry-points.simple_module]
dashboard = "sm_dashboard.module:DashboardModule"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
simple-module-core = { workspace = true }
simple-module-db = { workspace = true }
simple-module-hosting = { workspace = true }
sm-products = { workspace = true }
