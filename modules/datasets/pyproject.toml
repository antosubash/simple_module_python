[project]
name = "datasets"
version = "0.1.0"
description = "The Datasets module"
authors = []
requires-python = ">=3.12"
dependencies = [
    "simple-module-core",
    "simple-module-db",
    "simple-module-hosting",
    "file-storage",
]

[project.entry-points.simple_module]
datasets = "datasets.module:DatasetsModule"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Ship the module-root package.json inside the wheel so the host can
# discover JS deps via importlib.resources after a pip install.
[tool.hatch.build.targets.wheel.force-include]
"package.json" = "datasets/package.json"

[tool.uv.sources]
simple-module-core = { workspace = true }
simple-module-db = { workspace = true }
simple-module-hosting = { workspace = true }
file-storage = { workspace = true }
