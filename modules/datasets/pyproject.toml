[project]
name = "simple_module_datasets"
version = "0.0.1"
description = "Geospatial + tabular dataset upload, parsing (shapely) and slugging for simple_module apps"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Anto Subash", email = "antosubash@live.com" }]
keywords = ["simple-module", "geospatial", "shapely", "datasets", "gis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]
dependencies = [
    "simple_module_core==0.0.1",
    "simple_module_db==0.0.1",
    "simple_module_hosting==0.0.1",
    "simple_module_file_storage==0.0.1",
    "simple_module_background_tasks==0.0.1",
    "celery>=5.4",
    "shapely>=2.0",
    "python-slugify>=8.0",
]

[project.entry-points.simple_module]
datasets = "datasets.module:DatasetsModule"

[project.urls]
Homepage = "https://github.com/antosubash/simple_module_python"
Repository = "https://github.com/antosubash/simple_module_python"
Issues = "https://github.com/antosubash/simple_module_python/issues"
Changelog = "https://github.com/antosubash/simple_module_python/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["datasets"]

# Ship the module-root package.json inside the wheel so the host can
# discover JS deps via importlib.resources after a pip install.
[tool.hatch.build.targets.wheel.force-include]
"package.json" = "datasets/package.json"

[tool.uv.sources]
simple_module_core = { workspace = true }
simple_module_db = { workspace = true }
simple_module_hosting = { workspace = true }
simple_module_file_storage = { workspace = true }
simple_module_background_tasks = { workspace = true }
