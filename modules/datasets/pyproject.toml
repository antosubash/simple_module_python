[project]
name = "simple-module-datasets"
version = "0.1.0"
description = "The Datasets module"
authors = []
requires-python = ">=3.12"
dependencies = [
    "simple-module-core",
    "simple-module-db",
    "simple-module-hosting",
    "simple-module-file-storage",
    "simple-module-background-tasks",
    "celery>=5.4",
    "shapely>=2.0",
    "python-slugify>=8.0",
]

[project.entry-points.simple_module]
datasets = "datasets.module:DatasetsModule"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["datasets"]

# Ship the module-root package.json inside the wheel so the host can
# discover JS deps via importlib.resources after a pip install.
[tool.hatch.build.targets.wheel.force-include]
"package.json" = "datasets/package.json"

[tool.uv.sources]
simple-module-core = { workspace = true }
simple-module-db = { workspace = true }
simple-module-hosting = { workspace = true }
simple-module-file-storage = { workspace = true }
simple-module-background-tasks = { workspace = true }
