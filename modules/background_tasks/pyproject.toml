[project]
name = "background-tasks"
version = "0.1.0"
description = "Celery + Redis task queue with admin UI for monitoring and retrying failed/stuck tasks"
authors = []
requires-python = ">=3.12"
dependencies = [
    "simple-module-core",
    "simple-module-db",
    "simple-module-hosting",
    "celery[redis]>=5.4",
    "redis>=5",
]

[project.entry-points.simple_module]
background_tasks = "background_tasks.module:BackgroundTasksModule"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Ship the module-root package.json inside the wheel so the host can
# discover JS deps via importlib.resources after a pip install.
[tool.hatch.build.targets.wheel.force-include]
"package.json" = "background_tasks/package.json"

[tool.uv.sources]
simple-module-core = { workspace = true }
simple-module-db = { workspace = true }
simple-module-hosting = { workspace = true }
