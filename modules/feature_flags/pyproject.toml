[project]
name = "simple-module-feature-flags"
version = "0.1.0"
description = "The FeatureFlags module"
authors = []
requires-python = ">=3.12"
dependencies = [
    "simple-module-core",
    "simple-module-db",
    "simple-module-hosting",
]

[project.entry-points.simple_module]
feature_flags = "feature_flags.module:FeatureFlagsModule"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["feature_flags"]

[tool.uv.sources]
simple-module-core = { workspace = true }
simple-module-db = { workspace = true }
simple-module-hosting = { workspace = true }
