[project]
name = "settings"
version = "0.1.0"
description = "The Settings module"
authors = []
requires-python = ">=3.12"
dependencies = [
    "simple-module-core",
    "simple-module-db",
    "simple-module-hosting",
]

[project.entry-points.simple_module]
settings = "settings.module:SettingsModule"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Ship the module-root package.json inside the wheel so the host can
# discover JS deps via importlib.resources after a pip install.
[tool.hatch.build.targets.wheel.force-include]
"package.json" = "settings/package.json"

[tool.uv.sources]
simple-module-core = { workspace = true }
simple-module-db = { workspace = true }
simple-module-hosting = { workspace = true }
