[project]
name = "simple-module-file-storage"
version = "0.1.0"
description = "The FileStorage module"
authors = []
requires-python = ">=3.12"
dependencies = [
    "simple-module-core",
    "simple-module-db",
    "simple-module-hosting",
    "aiofiles>=23",
]

[project.optional-dependencies]
s3 = ["aioboto3>=13"]

[project.entry-points.simple_module]
file_storage = "file_storage.module:FileStorageModule"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["file_storage"]

# Ship the module-root package.json inside the wheel so the host can
# discover JS deps via importlib.resources after a pip install.
[tool.hatch.build.targets.wheel.force-include]
"package.json" = "file_storage/package.json"

[tool.uv.sources]
simple-module-core = { workspace = true }
simple-module-db = { workspace = true }
simple-module-hosting = { workspace = true }
