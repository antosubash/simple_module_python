[project]
name = "simple_module_api_tokens"
version = "0.0.40"
description = "Personal access tokens and service API keys for simple_module"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Anto Subash", email = "antosubash@live.com" }]
keywords = ["simple-module", "api-tokens", "personal-access-tokens", "api-keys", "fastapi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]
dependencies = [
    "simple_module_core==0.0.40",
    "simple_module_db==0.0.40",
    "simple_module_hosting==0.0.40",
    "simple_module_inertia==0.0.40",
    "simple_module_auth==0.0.40",
    "simple_module_settings==0.0.40",
    # Owners are read through the app's user directory, so ``users`` is not
    # required. ``GUID`` (the owner column's type, as ``users_user.id`` has it)
    # comes from here.
    "fastapi-users-db-sqlalchemy>=7,<8",
]

[project.entry-points.simple_module]
api_tokens = "api_tokens.module:ApiTokensModule"

[project.urls]
Homepage = "https://github.com/antosubash/simple_module_python"
Repository = "https://github.com/antosubash/simple_module_python"
Issues = "https://github.com/antosubash/simple_module_python/issues"
Changelog = "https://github.com/antosubash/simple_module_python/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The distribution name (simple_module_api_tokens) doesn't match the package
# directory (api_tokens), so hatchling can't infer what to ship — without
# this the wheel builds empty and the entry point fails to import.
[tool.hatch.build.targets.wheel]
packages = ["api_tokens"]

# Ship the module-root package.json inside the wheel so the host can
# discover JS deps via importlib.resources after a pip install.
[tool.hatch.build.targets.wheel.force-include]
"package.json" = "api_tokens/package.json"

[tool.uv.sources]
simple_module_core = { workspace = true }
simple_module_db = { workspace = true }
simple_module_hosting = { workspace = true }
simple_module_inertia = { workspace = true }
simple_module_auth = { workspace = true }
simple_module_settings = { workspace = true }
