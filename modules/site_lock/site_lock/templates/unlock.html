<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Protected</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #f7f7f8; color: #18181b; padding: 1.5rem;
  }
  .card {
    width: 100%; max-width: 22rem; background: #fff;
    border: 1px solid #e4e4e7; border-radius: 0.75rem;
    padding: 2rem; box-shadow: 0 1px 3px rgba(0,0,0,.06);
  }
  h1 { margin: 0 0 .25rem; font-size: 1.125rem; font-weight: 600; }
  p { margin: 0 0 1.25rem; font-size: .875rem; color: #52525b; line-height: 1.5; }
  label { display: block; font-size: .8125rem; font-weight: 500; margin-bottom: .375rem; }
  input {
    width: 100%; padding: .5rem .75rem; font-size: .875rem;
    border: 1px solid #d4d4d8; border-radius: .5rem; background: #fff; color: inherit;
  }
  input:focus { outline: 2px solid #6366f1; outline-offset: 1px; border-color: transparent; }
  button {
    width: 100%; margin-top: 1rem; padding: .5rem .75rem;
    font-size: .875rem; font-weight: 500; color: #fff; background: #18181b;
    border: 0; border-radius: .5rem; cursor: pointer;
  }
  button:hover { background: #27272a; }
  .error {
    margin: 0 0 1rem; padding: .5rem .75rem; font-size: .8125rem;
    color: #991b1b; background: #fef2f2; border: 1px solid #fecaca; border-radius: .5rem;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #09090b; color: #fafafa; }
    .card { background: #18181b; border-color: #27272a; box-shadow: none; }
    p { color: #a1a1aa; }
    input { background: #09090b; border-color: #3f3f46; }
    button { background: #fafafa; color: #18181b; }
    button:hover { background: #e4e4e7; }
    .error { color: #fca5a5; background: #7f1d1d33; border-color: #7f1d1d; }
  }
</style>
</head>
<body>
  <main class="card">
    <h1>Protected</h1>
    <p>$message</p>
    $error
    <form method="post" action="/__unlock">
      <input type="hidden" name="next" value="$next_url">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" autofocus required>
      <button type="submit">Continue</button>
    </form>
  </main>
</body>
</html>
