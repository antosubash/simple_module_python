[project]
name = "simple_module_lacowiki"
version = "0.0.8"
description = "LacoWiki migration: datasets, legends, sampling, validation, reports"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Anto Subash", email = "antosubash@live.com" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Typing :: Typed",
]
dependencies = [
    "simple_module_core==0.0.8",
    "simple_module_hosting==0.0.8",
    "simple_module_users==0.0.8",
]

[project.entry-points.simple_module]
lacowiki = "lacowiki.module:LacoWikiModule"

[project.urls]
Homepage = "https://github.com/antosubash/simple_module_python"
Repository = "https://github.com/antosubash/simple_module_python"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lacowiki"]

[tool.hatch.build.targets.wheel.force-include]
"package.json" = "lacowiki/package.json"

[tool.uv.sources]
simple_module_core = { workspace = true }
simple_module_hosting = { workspace = true }
simple_module_users = { workspace = true }
