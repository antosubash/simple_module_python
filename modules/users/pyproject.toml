[project]
name = "users"
version = "0.1.0"
description = "Local user management (replaces Keycloak)"
authors = [
    { name = "Anto Subash", email = "antosubash@live.com" }
]
requires-python = ">=3.12"
dependencies = [
    "simple-module-core",
    "simple-module-db",
    "simple-module-hosting",
    "auth",                           # workspace module — contracts
    # Pinned to a narrow range: `deps.py` relies on mutating CookieTransport
    # fields after construction (see reconfigure_cookie_transport in backend.py).
    # Bumping the major version requires re-checking those field names.
    "fastapi-users[sqlalchemy]>=15,<16",
    "aiosmtplib>=3.0",
    "cachetools>=5.3",
    "typer>=0.12",
]

[project.entry-points.simple_module]
users = "users.module:UsersModule"

[project.scripts]
sm-users = "users.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"package.json" = "users/package.json"

[tool.uv.sources]
simple-module-core = { workspace = true }
simple-module-db = { workspace = true }
simple-module-hosting = { workspace = true }
auth = { workspace = true }
