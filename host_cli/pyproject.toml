[project]
name = "smdev-cli"
version = "0.1.0"
description = "smdev: command line for the simple_module_python dev host's REST API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["simple-module-remote"]

[project.scripts]
smdev = "smdev_cli:main"

[tool.uv.sources]
simple-module-remote = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["smdev_cli"]
