[project]
name = "simple-module-python"
version = "0.1.0"
description = "A modular monolith framework for Python using FastAPI, Inertia.js, and React"
requires-python = ">=3.12"
dependencies = []

[tool.uv.workspace]
members = [
    "framework/*",
    "modules/*",
    "host",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.8",
    "playwright>=1.58.0",
    "pytest-playwright>=0.7.2",
    "ty>=0.0.29",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Scaffold templates are copied verbatim (and some live under __PACKAGE__/
# placeholder dirs that aren't valid Python packages until substituted).
extend-exclude = ["framework/hosting/simple_module_hosting/templates"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors (PEP 8)
    "W",      # pycodestyle warnings (PEP 8)
    "F",      # pyflakes
    "I",      # isort
    "N",      # PEP 8 naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
    "C4",     # flake8-comprehensions
    "RET",    # flake8-return
    "PTH",    # flake8-use-pathlib
    "PIE",    # flake8-pie
    "RUF",    # ruff-specific rules
]
ignore = [
    "B008",   # Depends() in default args is idiomatic FastAPI
    "B027",   # Empty methods in ABC without @abstractmethod — used for optional hooks
]

[tool.ty.environment]
extra-paths = [
    "framework/core",
    "framework/db",
    "framework/hosting",
    "framework/testing",
    "modules/auth",
    "modules/dashboard",
    "modules/products",
    "modules/users",
    "host",
]

[tool.ty.src]
# Host scaffold templates are copied verbatim; they aren't imported, so
# type-checking them against this repo's alembic version is misleading.
exclude = ["framework/hosting/simple_module_hosting/templates/**"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["framework/core/tests", "framework/db/tests", "framework/hosting/tests", "framework/testing/tests", "modules/auth/tests", "modules/dashboard/tests", "modules/products/tests", "modules/users/tests", "tests/integration", "tests/e2e"]
markers = ["e2e: end-to-end tests requiring a live browser"]
addopts = "-m 'not e2e'"
