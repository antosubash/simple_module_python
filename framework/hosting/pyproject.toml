[project]
name = "simple-module-hosting"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Anto Subash", email = "antosubash@live.com" }
]
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "fastapi>=0.115",
    "fastapi-inertia>=1.0",
    "httpx>=0.27",
    "jinja2>=3.1",
    "simple-module-core",
    "simple-module-db",
    "starlette>=0.44",
    "uvicorn[standard]>=0.34",
]

[project.scripts]
sm = "simple_module_hosting.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["simple_module_hosting"]

[tool.hatch.build.targets.wheel.force-include]
"simple_module_hosting/templates" = "simple_module_hosting/templates"

[tool.uv.sources]
simple-module-core = { workspace = true }
simple-module-db = { workspace = true }
