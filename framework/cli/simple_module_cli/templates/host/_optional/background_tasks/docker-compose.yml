services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: simple_module
      POSTGRES_USER: sm
      POSTGRES_PASSWORD: sm
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sm -d simple_module"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  host:
    build:
      context: .
      dockerfile: docker/host.Dockerfile
    env_file: .env
    environment:
      SM_DATABASE_URL: ${SM_DATABASE_URL:-postgresql+asyncpg://sm:sm@postgres:5432/simple_module}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    env_file: .env
    environment:
      SM_BG_TASKS_BROKER_URL: redis://redis:6379/0
      SM_BG_TASKS_RESULT_BACKEND: redis://redis:6379/1
      SM_DATABASE_URL: ${SM_DATABASE_URL:-postgresql+asyncpg://sm:sm@postgres:5432/simple_module}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command:
      - "uv"
      - "run"
      - "celery"
      - "-A"
      - "scripts.run_worker:celery"
      - "worker"
      - "-l"
      - "info"
      - "--concurrency=4"

  beat:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    env_file: .env
    environment:
      SM_BG_TASKS_BROKER_URL: redis://redis:6379/0
      SM_BG_TASKS_RESULT_BACKEND: redis://redis:6379/1
      SM_DATABASE_URL: ${SM_DATABASE_URL:-postgresql+asyncpg://sm:sm@postgres:5432/simple_module}
    depends_on:
      redis:
        condition: service_healthy
      worker:
        condition: service_started
    command:
      - "uv"
      - "run"
      - "celery"
      - "-A"
      - "scripts.run_worker:celery"
      - "beat"
      - "-l"
      - "info"

volumes:
  pgdata:
  redisdata:
