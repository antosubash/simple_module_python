[alembic]
# Resolve script_location relative to this ini file, not the invocation cwd,
# so `alembic -c host/alembic.ini ...` works from the repo root. Running from
# the repo root is what lets alembic read the repo-root .env — and therefore
# the same SM_DATABASE_URL the app itself uses.
script_location = %(here)s/migrations
sqlalchemy.url =

# Run the project's ruff on every new revision, so `make migration` output
# passes `make lint` (GH #896). Only the import rules are fixed: the unused
# `sa`/`op` imports of an empty revision stay for its author to use.
[post_write_hooks]
hooks = ruff_imports, ruff_format
ruff_imports.type = module
ruff_imports.module = ruff
ruff_imports.options = check --select I --fix --quiet REVISION_SCRIPT_FILENAME
ruff_format.type = module
ruff_format.module = ruff
ruff_format.options = format --quiet REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
