[alembic]
# Resolve script_location relative to this ini file, not the invocation cwd,
# so `alembic -c host/alembic.ini ...` works from the repo root. Running from
# the repo root is what lets alembic read the repo-root .env — and therefore
# the same SM_DATABASE_URL the app itself uses.
script_location = %(here)s/migrations
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
