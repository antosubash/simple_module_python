[project]
name = "simple-module-testing"
version = "0.1.0"
description = "Shared pytest fixtures and helpers for authoring SimpleModule modules"
authors = [
    { name = "Anto Subash", email = "antosubash@live.com" },
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "simple-module-core>=1.0,<2.0",
    "simple-module-db>=1.0,<2.0",
    "simple-module-hosting>=1.0,<2.0",
    "sqlalchemy>=2.0",
]

# Exposing pytest fixtures as a plugin lets module tests just
# `pip install simple-module-testing[dev]` and get the fixtures for free —
# no need for them to write their own `conftest.py`.
[project.entry-points.pytest11]
simple_module_testing = "simple_module_testing.plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["simple_module_testing"]

[tool.uv.sources]
simple-module-core = { workspace = true }
simple-module-db = { workspace = true }
simple-module-hosting = { workspace = true }
